server:
  port: 8091  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: remark-service
nhzx:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.nuaa.remark.controller
    title: 南航智学 - 评价中心接口文档
    description: 该服务包含评价、点赞等功能
    contact-name: 开发组
    contact-url: https://localhost
    contact-email: dev@localhost
    version: v1.0
  jdbc:
    database: nhzx_remark
  auth:
    resource:
      enable: true # 登录拦截功能
