spring:
  cloud:
    nacos:
      server-addr: localhost:8848 # nacos注册中心
      username: nacos
      password: nacos
      discovery:
        namespace: nhzx
        group: DEFAULT_GROUP
        ip: 127.0.0.1
      config:
        namespace: nhzx
        file-extension: yaml
  config:
    import:
      - nacos:${spring.application.name}.yaml # 导入本服务的配置
      - nacos:shared-spring.yaml # 共享spring配置
#      - nacos:shared-redis.yaml # 共享redis配置
      - nacos:shared-logs.yaml # 共享日志配置
      - nacos:shared-feign.yaml # 共享feign配置
      - nacos:shared-mybatis.yaml # 共享mybatis配置
  data:
    mongodb:
      host: 192.168.150.101
      port: 27017
      database: nhzx
      authentication-database: admin #认证数据库
      username: nhzx
      password: "123321"
      auto-index-creation: true #自动创建索引
    redis:
      host: 192.168.150.101
      port: 16379
      password: 123456
      client-type: jedis
